services:
  - type: web
    name: our-911-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:////var/data/our911.db
      - key: CORS_ORIGINS
        sync: false
      - key: PYTHON_VERSION
        value: 3.13.4
    disk:
      name: our-911-data
      mountPath: /var/data
      sizeGB: 1

  - type: web
    name: our-911-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
